name: Feature request
description: Suggest an improvement to STRATO.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Suggestions in English or Italian are welcome.
        Check existing issues before submitting. Use synthetic examples and avoid private models or personal information.
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to complete and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behaviour you would like and an example of how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant screenshots, examples or printer/slicer details, with sensitive information removed.
