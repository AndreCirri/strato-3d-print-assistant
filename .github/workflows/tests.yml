name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      STRATO_SLICER_EXE: missing/slicer.exe
      STRATO_SLICER_PROFILES: missing/profiles
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Tests with branch coverage
        run: python -m coverage run -m unittest discover -q
      - name: Coverage reports
        if: ${{ always() }}
        run: |
          python -m coverage report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python verifiche/report_copertura.py
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
